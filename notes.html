<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Notlar | Kişisel Panel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0f16'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='bold' fill='%232563eb' text-anchor='middle'%3E%C3%87%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dash-body" data-page="notes">

    <div class="dash-container">
        <header class="dash-header">
            <h1 class="dash-text-gradient">Kişisel Notlar</h1>
            <div class="dash-header-actions">
                <button onclick="toggleTheme()" class="dash-btn dash-btn-outline" style="border:none; font-size:20px; padding:4px 8px;" title="Temayı Değiştir">🌗</button>
                <button onclick="requestNotificationPermission()" class="dash-btn dash-btn-outline" style="border:none; font-size:20px; padding:4px 8px;" title="Bildirimleri Aç">🔔</button>
                <a href="dashboard.html" class="dash-btn dash-btn-outline">Dashboard'a Dön</a>
                <a href="index.html" class="dash-btn dash-btn-outline">Ana Siteye Dön</a>
                <button onclick="doLogout()" class="dash-btn dash-btn-outline" style="color:var(--dash-danger); border-color:var(--dash-danger);">Çıkış Yap</button>
            </div>
        </header>

        <div class="dash-split-grid">
            <div class="dash-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h2 style="margin:0;">Notlarım</h2>
                    <button class="dash-btn dash-btn-primary" style="padding:6px 14px; font-size:13px;" onclick="addNewNote()">+ Yeni Not</button>
                </div>
                <div id="notes-sidebar-list" class="dash-list"></div>
            </div>

            <div class="dash-card">
                <h2 style="margin-bottom:16px;">Not Düzenle</h2>
                <div class="dash-form-group" style="margin-bottom:16px;">
                    <label>Başlık</label>
                    <input type="text" id="note-title" class="dash-input" placeholder="Not başlığı...">
                </div>
                <div class="dash-form-group" style="margin-bottom:16px;">
                    <label>İçerik</label>
                    <textarea id="note-content" class="dash-textarea" style="min-height:280px;" placeholder="Notunuzu buraya yazın..."></textarea>
                </div>
                <button class="dash-btn dash-btn-primary" style="width:100%;" onclick="saveNote()">Kaydet</button>
            </div>
        </div>
    </div>

    <script defer src="dashboard.js"></script>
</body>
</html>
