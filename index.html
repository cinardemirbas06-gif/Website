        const Counter = ({ end, suffix = "", text }) => {
            const [count, setCount] = useState(0);
            const nodeRef = useRef(null);
            const [inView, setInView] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setInView(true); observer.disconnect(); }
                }, { threshold: 0.5 });
                if (nodeRef.current) observer.observe(nodeRef.current);
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                if (inView) {
                    let start = 0;
                    const increment = end / (2000 / 16);
                    const timer = setInterval(() => {
                        start += increment;
                        if (start >= end) { clearInterval(timer); setCount(end); } else { setCount(Math.floor(start)); }
                    }, 16);
                    return () => clearInterval(timer);
                }
            }, [inView, end]);

            return (
                <div ref={nodeRef} className="flex flex-col items-center text-center p-6 bg-white/[0.02] border border-white/5 rounded-[20px] hover:border-accent/30 transition-colors duration-300">
                    <h4 className="text-4xl md:text-5xl font-black text-white mb-2">{count}<span className="text-accent">{suffix}</span></h4>
                    <p className="text-gray-400 font-medium">{text}</p>

                return () => clearInterval(int);
            }, [isRunning]);
            const ms = ("0" + ((time / 10) % 100)).slice(-2);

        const UrlEncodeTool = () => {

                        <div className="flex-1"><label className="text-sm text-gray-400 block mb-2">Mevcut Yükseklik</label><input type="number" value={h1} onChange={e=>setH1(e.target.value)} className="w-full bg-[#0a0f16] border border-white/10 rounded-xl px-4 py-3 text-white" /></div>
                    </div>
                    <div className="flex gap-4 items-center">

                    </div>

        const PercentageTool = () => {
            const [p, setP] = useState(20); const [v, setV] = useState(150);

                <div className="flex items-center gap-4 bg-[#0a0f16] border border-white/10 p-6 rounded-xl overflow-x-auto">
                    <input type="number" value={v} onChange={e=>setV(e.target.value)} className="w-24 bg-transparent text-2xl text-white border-b border-white/20 focus:border-accent outline-none text-center" />

                    <input type="number" value={p} onChange={e=>setP(e.target.value)} className="w-20 bg-transparent text-2xl text-accent border-b border-accent/50 focus:border-accent outline-none text-center" />

                    <span className="text-4xl font-black text-white ml-auto">{(v*p)/100}</span>

        const BinaryTool = () => {
            const [t, setT] = useState('CodeWithCiko');
            const toBinary = (str) => str.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join(' ');
            return (
                <div className="space-y-4">
                    <textarea placeholder="Metin girin..." value={t} onChange={e=>setT(e.target.value)} rows="3" className="w-full bg-[#0a0f16] border border-white/10 rounded-xl px-4 py-3 text-white focus:border-accent outline-none resize-none"></textarea>
                    <textarea readOnly value={toBinary(t)} rows="4" className="w-full bg-black/50 border border-white/5 rounded-xl px-4 py-3 text-accent outline-none font-mono text-sm resize-none"></textarea>
                </div>
            );
        };

        const PomodoroTool = () => {
            const [timeLeft, setTimeLeft] = useState(25 * 60);

            useEffect(() => {

                if (isActive && timeLeft > 0) interval = setInterval(() => setTimeLeft(timeLeft - 1), 1000);
                else if (timeLeft === 0) { setIsActive(false); alert("Süre doldu! Mola vakti."); }
                return () => clearInterval(interval);
            }, [isActive, timeLeft]);
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            return (
                <div className="space-y-6 text-center">

        const BmiTool = () => {
            const [h, setH] = useState(175); const [w, setW] = useState(70);

                    <div className="bg-[#0a0f16] border border-white/5 p-6 rounded-xl flex flex-col items-center justify-center gap-2">
                        <p className="text-5xl font-black text-white">{bmi}</p>

                { title: "Tasarım ve Kodlama", desc: "Onayınız doğrultusunda modern bir arayüz tasarlanır ve performanslı kodlama süreci tamamlanır.", detailed: "Hazırlanan tasarım onayınızdan geçtikten sonra, en güncel teknolojiler (React, Tailwind vb.) kullanılarak SEO dostu ve hızlı kodlama başlar." },

                { title: "A Record", desc: "Domaini bir IP adresine yönlendirir.", detailed: "Domainin bağlı olduğu sunucunun asıl kimliğini (IP adresini) işaret eden temel DNS kaydıdır.", icon: "M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z M15 11a3 3 0 11-6 0 3 3 0 016 0z" },

                { title: "MX Record", desc: "Kurumsal maillerin yönlendirmesini yapar.", detailed: "info@firmaniz.com gibi maillerin düzgün çalışması ve size ulaşan e-postaların doğru sunucuya iletilmesi için şarttır.", icon: "M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" },
                { title: "SSL", desc: "Sitenin güvenli bağlantı kullanmasını sağlar.", detailed: "Tarayıcıda 'Güvenli' kilidini çıkarır ve HTTPS protokolü sağlar. Müşteri güveni, veri şifreleme ve SEO için şarttır.", icon: "M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7a4 4 0 00-8 0v4h8z" },

        const FAQ = () => {
            const [openIndex, setOpenIndex] = useState(null);
            const faqs = [
                { q: "Domain ve Hosting farkı nedir?", a: "Çok basit bir örnekle: Domain sitenizin adresi ve ismidir (firmaadi.com). Hosting ise o adresin içindeki dosyalarınızın tutulduğu dükkandır. İkisi birleşince siteniz internette yayına girer." },
                { q: "Statik site ile Dinamik site arasındaki fark nedir?", a: "Statik siteler (kurumsal tanıtım, landing page) içeriği sabit ve çok hızlıdır. Dinamik siteler ise (e-ticaret, blog) bir veritabanına sahiptir, içerikleri sürekli değişebilir ve büyümeye uygundur." },
                { q: "Site yayına alma süreci nasıl işler?", a: "1. Domain seçilir. 2. Hosting alınır. 3. Sitenin kodlaması ve tasarımı yapılır. 4. Domain hostinge bağlanır. 5. SSL (Güvenlik) kurulur. 6. Testler yapılır ve siteniz yayına açılır." },
                { q: "Bir web sitesi ne kadar sürede biter?", a: "Projenin kapsamına bağlı olarak genellikle 2 ila 4 hafta arasında teslim ediyorum. Basit açılış sayfaları 1 hafta içinde tamamlanabilir." },
                { q: "Kurumsal e-posta (info@...) sağlıyor musunuz?", a: "Evet, talebiniz doğrultusunda firmanıza prestij katacak domain uzantılı profesyonel maillerin kurulumunu (MX ayarlarını) yapıyorum." },
                { q: "Site yayınlandıktan sonra bakım ve yedekleme var mı?", a: "Kesinlikle. Sitenin çökme riski, veritabanı yedekleme ihtiyacı ve güvenlik güncellemeleri önemlidir. Yayın sonrası teknik destek ve haftalık yedekleme paketleri ile yanınızdayım." }
            ];

            return (
                <section className="py-24 relative border-t border-white/5 bg-white/[0.01]">

                                <Reveal key={i} delay={i * 0.1}>
                                    <div className={`border ${openIndex === i ? 'border-accent' : 'border-white/10'} bg-white/[0.02] rounded-[20px] overflow-hidden transition-colors cursor-pointer`} onClick={() => setOpenIndex(openIndex === i ? null : i)}>

                                            <svg className={`w-5 h-5 text-accent transform transition-transform duration-300 ${openIndex === i ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                                        </div>
                                        <AnimatePresence>{openIndex === i && (<motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: "auto", opacity: 1 }} exit={{ height: 0, opacity: 0 }} transition={{ duration: 0.3 }}><div className="px-6 pb-6 text-gray-400 leading-relaxed">{faq.a}</div></motion.div>)}</AnimatePresence>
                                    </div>
                                </Reveal>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Blog = () => {
            const [selectedPost, setSelectedPost] = useState(null);

            const posts = [
                {
                    id: 'why-nextjs',
                    img: 'https://images.unsplash.com/photo-1633356122544-f134324a6cee?q=80&w=800&auto=format&fit=crop',
                    category: 'Frameworks',
                    title: 'Neden Projelerimde Next.js Kullanıyorum?',
                    excerpt: 'Modern web geliştirmenin vazgeçilmezi olan Next.js\'in sunduğu Server-Side Rendering, SEO avantajları ve geliştirici deneyimi üzerine bir bakış.',
                    content: '<h2>Next.js: Sadece Bir React Framework\'ünden Daha Fazlası</h2><p>Next.js, Vercel tarafından geliştirilen, üretim ortamı için hazır, sunucu taraflı render (SSR) ve statik site oluşturma (SSG) gibi özellikleri bünyesinde barındıran popüler bir React framework\'üdür. Peki onu bu kadar özel kılan nedir?</p><h3>1. Performans ve SEO</h3><p>Geleneksel Client-Side Rendered (CSR) React uygulamalarının aksine, Next.js sayfaları sunucuda oluşturup tarayıcıya hazır HTML olarak gönderir. Bu, arama motoru botlarının (Google, Bing vb.) sitenizi çok daha kolay ve hızlı bir şekilde taramasını (indexlemesini) sağlar. Bu da doğrudan SEO performansınıza olumlu etki eder.</p><h3>2. Geliştirici Deneyimi (DX)</h3><p>Dosya tabanlı yönlendirme (file-based routing), otomatik kod bölme (code splitting), hızlı yeniden yükleme (fast refresh) gibi özellikler geliştirme sürecini inanılmaz derecede hızlandırır ve basitleştirir. Karmaşık konfigürasyonlarla uğraşmak yerine doğrudan ürün geliştirmeye odaklanabilirsiniz.</p><h3>3. Esneklik</h3><p>Next.js ile projenizin ihtiyacına göre sayfa bazında render metodu seçebilirsiniz. Bazı sayfaları statik olarak (SSG) oluşturup CDN üzerinden ışık hızında sunarken, bazılarını her istekte sunucuda (SSR) veya istemcide (CSR) oluşturabilirsiniz. Bu hibrit yaklaşım, onu her türlü proje için uygun kılar.</p>'
                },
                {
                    id: 'tailwind-love',
                    img: 'https://images.unsplash.com/photo-1643225245487-55e54162935c?q=80&w=800&auto=format&fit=crop',
                    category: 'CSS',
                    title: 'Tailwind CSS: Utility-First Yaklaşımının Gücü',
                    excerpt: 'Sürekli aynı CSS kodlarını yazmaktan sıkıldınız mı? Tailwind CSS\'in "utility-first" felsefesiyle tasarım sistemlerini nasıl hızlandırdığını keşfedin.',
                    content: '<h2>"Sadece Class İsimleri Yazarak Tasarım Yapmak"</h2><p>Tailwind CSS, önceden tanımlanmış, tek bir amaca hizmet eden küçük yardımcı sınıflar (utility classes) setidir. Örneğin, <strong>flex items-center justify-center</strong> yazdığınızda, bu üç sınıf bir araya gelerek bir flex container oluşturur ve içeriğini hem dikeyde hem de yatayda ortalar.</p><h3>Avantajları Nelerdir?</h3><ul><li><strong>Hız:</strong> Sürekli CSS dosyaları arasında geçiş yapmak yerine doğrudan HTML içinde stil verirsiniz.</li><li><strong>Tutarlılık:</strong> Tasarım sisteminizdeki renkler, boşluklar, font boyutları gibi değerler config dosyasında tanımlandığı için tüm projede tutarlı bir görünüm elde edilir.</li><li><strong>Performans:</strong> Üretim (production) build\'i sırasında kullanılmayan tüm CSS sınıfları otomatik olarak temizlenir (purging), bu da sonuç dosyasının inanılmaz derecede küçük olmasını sağlar.</li></ul><p>Başlangıçta HTML\'in "kirli" görünmesi endişe verse de, bileşen tabanlı (component-based) modern framework\'ler (React, Vue) ile kullanıldığında bu sorun ortadan kalkar ve geliştirme süreci inanılmaz keyifli bir hal alır.</p>'
                },
                {
                    id: 'react-hooks',
                    img: 'https://images.unsplash.com/photo-1633356122102-3fe601e05bd2?q=80&w=800&auto=format&fit=crop',
                    category: 'React',
                    title: 'React Hooks\'un Büyüsü: useState ve useEffect',
                    excerpt: 'Fonksiyonel bileşenlere state ve lifecycle özellikleri kazandıran `useState` ve `useEffect` hook\'larının temel mantığı ve kullanım alanları.',
                    content: '<h2>Class Component\'lerden Fonksiyonel Dünyaya Geçiş</h2><p>React 16.8 ile hayatımıza giren Hooks, class component\'lerin karmaşıklığı olmadan React\'in güçlü özelliklerini kullanmamızı sağlar.</p><h3>useState: Durum Yönetimi</h3><p>Bir bileşenin içinde değiştiğinde arayüzün de yeniden render edilmesini istediğimiz verileri tutmak için kullanılır. Örneğin bir sayacı veya bir form girdisini `useState` ile yönetiriz.</p><pre><code>const [count, setCount] = useState(0);</code></pre><h3>useEffect: Yan Etkiler (Side Effects)</h3><p>Bileşen render edildikten sonra çalıştırılması gereken kodlar için kullanılır. Örneğin bir API\'den veri çekmek, DOM\'u manuel olarak değiştirmek veya bir zamanlayıcı (timer) başlatmak gibi işlemler "yan etki" olarak kabul edilir ve `useEffect` içinde yönetilir.</p><pre><code>useEffect(() => {\n  // API\'den veri çek\n  fetch(\'https://api.example.com/data\')\n    .then(res => res.json())\n    .then(data => setData(data));\n}, []); // Boş dependency array, sadece ilk render\'da çalışır</code></pre><p>Bu iki hook, modern React geliştirmenin temel taşlarıdır ve birlikte kullanıldıklarında inanılmaz derecede güçlü ve esnek uygulamalar oluşturmamıza olanak tanır.</p>'
                }
            ];

            return (
                <>
                    <section id="blog" className="py-24 relative bg-darkbg border-t border-white/5">
                        <div className="max-w-7xl mx-auto px-6 md:px-12">
                            <SectionHeader title="Yazılarım & İçeriklerim" subtitle="Blog" />
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {posts.map((post, i) => (
                                    <Reveal key={post.id} delay={i * 0.15}>
                                        <div 
                                            className="group rounded-[20px] bg-white/[0.02] border border-white/10 overflow-hidden hover:border-accent/40 hover:shadow-[0_0_40px_rgba(37,99,235,0.1)] transition-all duration-500 cursor-pointer flex flex-col h-full"
                                            onClick={() => setSelectedPost(post)}
                                        >
                                            <div className="relative h-56 overflow-hidden bg-[#111827]">
                                                <img src={post.img} alt={post.title} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                                            </div>
                                            <div className="p-6 flex flex-col flex-grow">
                                                <span className="text-xs font-bold text-accent uppercase tracking-widest mb-2">{post.category}</span>
                                                <h3 className="text-xl font-bold text-white mb-3 tracking-tight flex-grow">{post.title}</h3>
                                                <p className="text-gray-400 text-sm leading-relaxed mb-4">{post.excerpt}</p>
                                                <span className="mt-auto text-accent font-bold text-sm group-hover:underline">Devamını Oku →</span>
                                            </div>
                                        </div>
                                    </Reveal>
                                ))}
                            </div>
                        </div>
                    </section>

                    <AnimatePresence>
                        {selectedPost && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 bg-darkbg/90 backdrop-blur-xl" onClick={() => setSelectedPost(null)}>
                                <button onClick={() => setSelectedPost(null)} className="absolute top-6 right-6 md:top-10 md:right-10 text-white/50 hover:text-white transition-colors z-[110]">
                                    <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                                <motion.div initial={{ scale: 0.9, y: 30 }} animate={{ scale: 1, y: 0 }} exit={{ scale: 0.9, y: 30 }} transition={{ type: "spring", damping: 25, stiffness: 300 }} className="relative w-full max-w-3xl bg-[#0d131f] rounded-2xl md:rounded-[2rem] border border-white/10 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]" onClick={(e) => e.stopPropagation()}>
                                    <img src={selectedPost.img} alt={selectedPost.title} className="w-full h-64 object-cover" />
                                    <div className="p-8 md:p-10 overflow-y-auto prose">
                                        <span className="text-sm font-bold text-accent uppercase tracking-widest mb-2 inline-block">{selectedPost.category}</span>
                                        <div dangerouslySetInnerHTML={{ __html: selectedPost.content }}></div>
                                    </div>
                                </motion.div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </>
            );
        };

        const About = () => (
            <section id="about" className="py-24 bg-gradient-to-br from-accent/5 to-transparent border-t border-white/5">
                <div className="max-w-6xl mx-auto px-6 md:px-12 grid lg:grid-cols-2 gap-16 items-center">
                    <Reveal>
                        <div className="relative max-w-md mx-auto lg:mx-0">
                            <div className="absolute inset-0 bg-accent/20 blur-[80px] rounded-full pointer-events-none"></div>
                            {/* Dönen Çember Animasyonları */}
                            <div className="absolute -inset-4 border-2 border-dashed border-accent/40 rounded-full animate-[spin_20s_linear_infinite] pointer-events-none"></div>
                            <div className="absolute -inset-8 border border-white/5 rounded-full animate-[spin_30s_linear_infinite_reverse] pointer-events-none"></div>
                            <div className="relative aspect-square rounded-[2rem] overflow-hidden border-4 border-white/10 shadow-2xl group hover:border-accent/50 transition-colors duration-500">
                                {/* Kendi fotoğrafınızı eklemek için src kısmına fotoğrafınızın adını (örn: "ben.jpg") yazabilirsiniz */}
                                <img src="images/ciko.jpeg" alt="Çınar" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                                <div className="absolute inset-0 bg-gradient-to-t from-darkbg/80 via-transparent to-transparent"></div>
                            </div>
                        </div>
                    </Reveal>
                    <Reveal delay={0.2}>
                        <h2 className="font-serif text-4xl md:text-5xl font-bold text-white mb-6">Merhaba, ben <span className="text-accent">Çınar.</span></h2>
                        <p className="text-lg md:text-xl text-gray-400 leading-relaxed font-light mb-6">
                            Küçük işletmeler ve girişimciler için <span className="text-white font-bold">temiz, hızlı ve kullanıcı dostu</span> web siteleri oluşturmaya odaklanmış serbest çalışan bir web geliştiricisiyim. 
                        </p>
                        <p className="text-lg md:text-xl text-gray-400 leading-relaxed font-light">
                            Sadece çalışan bir kod bütünü değil; estetik algısı yüksek, vizyoner ve kullanıcıda iz bırakan premium dijital deneyimler yaratmak için estetik ile işlevsellik arasında köprü kuruyorum.
                        </p>
                    </Reveal>
                </div>
            </section>
        );

        const Contact = () => {
            const [formData, setFormData] = useState({ name: '', email: '', phone: '', message: '' });
            const [status, setStatus] = useState('idle'); // idle, loading, success, error
            const [formMessage, setFormMessage] = useState('');

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setStatus('loading');
                try {
                    const res = await fetch('contact.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    const data = await res.json();
                    setStatus(data.success ? 'success' : 'error');
                    setFormMessage(data.message || (data.success ? 'Mesajınız başarıyla gönderildi.' : 'Gönderim başarısız oldu.'));
                    if (data.success) setFormData({ name: '', email: '', phone: '', message: '' });
                } catch (error) {
                    console.error("Form Gönderim Hatası Detayı:", error);
                    setStatus('error');
                    setFormMessage('Bağlantı hatası oluştu. Lütfen daha sonra tekrar deneyin.');
                }
            };

            return (
                <section id="contact" className="py-24 relative">
                    <div className="max-w-7xl mx-auto px-6 md:px-12 grid lg:grid-cols-2 gap-16 items-start">
                        <Reveal>
                            <h2 className="font-serif text-4xl md:text-5xl font-bold text-white mb-6">Birlikte <span className="text-accent">harika bir şey inşa edelim.</span></h2>
                            <p className="text-gray-400 text-lg mb-10">İster yeni bir web sitesine ister mevcut sitenizin yenilenmesine ihtiyacınız olsun, dijital varlığınızı büyütmenize yardımcı olmaya hazırım.</p>
                            
                            <div className="space-y-6">
                                <div className="flex items-center gap-4 group cursor-pointer">
                                    <div className="w-12 h-12 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-accent group-hover:bg-accent group-hover:text-darkbg transition-colors">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                    </div>
                                    <span className="text-lg text-white font-medium group-hover:text-accent transition-colors">iletisim@cinardemirbas.com.tr</span>
                                </div>
                                <div className="flex items-center gap-4 group cursor-pointer">
                                    <div className="w-12 h-12 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-accent group-hover:bg-accent group-hover:text-darkbg transition-colors">
                                        <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm3.98-10.834a1.44 1.44 0 10-2.88 0 1.44 1.44 0 002.88 0z"/></svg>
                                    </div>
                                    <span className="text-lg text-white font-medium group-hover:text-accent transition-colors">@cinardemirbas</span>
                                </div>
                            </div>
                        </Reveal>
                        
                        <Reveal delay={0.2}>
                            <div className="bg-white/[0.02] border border-white/10 p-8 md:p-10 rounded-[20px] shadow-2xl backdrop-blur-md">
                                <h3 className="text-2xl font-bold text-white mb-6">Mesaj Gönder</h3>
                                {status === 'success' ? (
                                    <div className="bg-accent/20 border border-accent text-accent p-6 rounded-xl flex flex-col items-center justify-center text-center space-y-4">
                                        <div className="w-16 h-16 bg-accent rounded-full flex items-center justify-center text-darkbg">
                                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                        </div>
                                        <p className="text-lg font-medium">{formMessage}</p>
                                        <button onClick={() => setStatus('idle')} className="mt-4 text-sm text-gray-400 underline hover:text-white transition-colors">Yeni mesaj gönder</button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSubmit} className="space-y-4">
                                        {status === 'error' && (
                                            <div className="bg-red-500/20 border border-red-500 text-red-400 p-4 rounded-xl text-sm">
                                                {formMessage}
                                            </div>
                                        )}
                                        <div>
                                            <label className="block text-gray-400 text-sm mb-2">Ad Soyad</label>
                                            <input required type="text" name="name" value={formData.name} onChange={handleChange} className="w-full bg-[#0a0f16] border border-white/10 rounded-xl px-4 py-3 text-white focus:border-accent outline-none transition-colors" placeholder="Adınız Soyadınız" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="block text-gray-400 text-sm mb-2">E-posta</label><input required type="email" name="email" value={formData.email} onChange={handleChange} className="w-full bg-[#0a0f16] border border-white/10 rounded-xl px-4 py-3 text-white focus:border-accent outline-none transition-colors" placeholder="ornek@mail.com" /></div>
                                            <div><label className="block text-gray-400 text-sm mb-2">Telefon</label><input required type="tel" name="phone" value={formData.phone} onChange={handleChange} className="w-full bg-[#0a0f16] border border-white/10 rounded-xl px-4 py-3 text-white focus:border-accent outline-none transition-colors" placeholder="05XX XXX XX XX" /></div>
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 text-sm mb-2">Mesajınız</label>
                                            <textarea required name="message" minLength="10" value={formData.message} onChange={handleChange} rows="4" className="w-full bg-[#0a0f16] border border-white/10 rounded-xl px-4 py-3 text-white focus:border-accent outline-none transition-colors resize-none" placeholder="Projenizden veya fikrinizden bahsedin..."></textarea>
                                        </div>
                                        <button disabled={status === 'loading'} type="submit" className="w-full bg-accent text-darkbg font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.3)] hover:shadow-[0_0_25px_rgba(37,99,235,0.5)] transition-all disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2">
                                            {status === 'loading' ? (
                                                <><div className="w-5 h-5 border-2 border-darkbg border-t-transparent rounded-full animate-spin"></div> Gönderiliyor...</>
                                            ) : 'Gönder'}
                                        </button>
                                    </form>
                                )}
