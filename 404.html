<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı | Çınar Demirbaş</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0a0f16">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0f16'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='bold' fill='%23d4af37' text-anchor='middle'%3E%C3%87%3C/text%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0f16;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 24px;
        }
        .code {
            font-size: clamp(64px, 18vw, 140px);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #d4af37 0%, #af52de 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 16px 0 8px;
        }
        p {
            color: #9ca3af;
            font-size: 15px;
            max-width: 420px;
            margin: 0 0 28px;
        }
        a.home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #d4af37;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            padding: 12px 28px;
            border-radius: 999px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        a.home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
        }
    </style>
</head>
<body>
    <p class="code">404</p>
    <h1>Bu sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış, silinmiş ya da hiç var olmamış olabilir. Ana sayfaya dönerek devam edebilirsiniz.</p>
    <a class="home-btn" href="/">← Ana Sayfaya Dön</a>
</body>
</html>
