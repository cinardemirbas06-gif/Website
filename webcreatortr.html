<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCreatorTR | Dijital Çözümler</title>
    <meta name="description" content="Web sitesi kurulumu, hosting, domain, özel yazılım ve profesyonel tasarım destek hizmetleri.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Framer Motion -->
    <script crossorigin src="https://unpkg.com/framer-motion@10.16.16/dist/framer-motion.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        darkbg: '#0a0f16',
                        accent: '#00ff88' /* SİTENİN ANA RENGİ: Bunu logonuzun HEX koduyla değiştirin (örn: #00b3ff) */
                    },
                    animation: {
                        'marquee': 'marquee 25s linear infinite',
                        'marquee-reverse': 'marquee-reverse 25s linear infinite',
                        'shine': 'shine 2s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-50%)' }
                        },
                        'marquee-reverse': {
                            '0%': { transform: 'translateX(-50%)' },
                            '100%': { transform: 'translateX(0%)' }
                        },
                        shine: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' }
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { 
            background-color: #0a0f16; 
            color: #d1d5db; 
            overflow-x: hidden;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0f16; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ff88; }
        
        /* Menüden tıklayınca başlıkların menü altında kalmaması için */
        [id] { scroll-margin-top: 100px; }

        /* Premium Arka Plan Izgarası */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
        }

        /* Light Mode ve Ekstralar */
        body.light-mode { background-color: #f8fafc; color: #1e293b; }
        body.light-mode .bg-darkbg, body.light-mode .bg-\[\#0a0f16\] { background-color: #ffffff; }
        body.light-mode .text-white { color: #0f172a; }
        body.light-mode .text-gray-400 { color: #64748b; }
        body.light-mode .text-gray-300 { color: #475569; }
        body.light-mode .border-white\/10 { border-color: #e2e8f0; }
        body.light-mode .border-white\/5 { border-color: #f1f5f9; }
        body.light-mode .bg-white\/\[0\.02\], body.light-mode .bg-white\/\[0\.05\], body.light-mode .bg-white\/5 { background-color: rgba(255,255,255,0.7); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-color:#e2e8f0; }
        body.light-mode .bg-white\/10 { background-color: #f1f5f9; }
        body.light-mode .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        body.light-mode .bg-grid { background-image: linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased selection:bg-accent/30 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const Motion = window.Motion || window.FramerMotion || {};
        const { motion, AnimatePresence } = Motion;

        const ServiceCard = ({ icon, title, desc, delay }) => (
            <motion.div
                initial={{ opacity: 0, x: -20 }}
                whileInView={{ opacity: 1, x: 0 }}
                viewport={{ once: true, margin: "-50px" }}
                transition={{ delay: delay, duration: 0.4 }}
                className="bg-white/[0.02] border border-white/10 p-5 rounded-[20px] backdrop-blur-md hover:border-accent/50 hover:bg-white/[0.05] transition-all duration-500 flex items-center gap-4 group hover:scale-[1.02] cursor-pointer shadow-lg hover:shadow-[0_0_30px_rgba(0,255,136,0.1)]"
            >
                <div className="w-14 h-14 rounded-xl bg-accent/10 flex items-center justify-center text-accent shrink-0 group-hover:bg-accent group-hover:text-darkbg transition-all duration-300 shadow-inner group-hover:scale-110 group-hover:rotate-3">
                    {icon}
                </div>
                <div className="flex-1">
                    <h3 className="text-white font-bold text-lg leading-tight transition-colors group-hover:text-accent">{title}</h3>
                    <div className="grid grid-rows-[0fr] group-hover:grid-rows-[1fr] transition-[grid-template-rows] duration-300 ease-in-out">
                        <div className="overflow-hidden">
                            <p className="text-gray-400 text-sm leading-relaxed mt-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-75">{desc}</p>
                        </div>
                    </div>
                </div>
            </motion.div>
        );

        const ProjectCard = ({ title, category, imgUrl, link, delay }) => (
            <motion.a
                href={link} target="_blank" rel="noopener noreferrer"
                initial={{ opacity: 0, scale: 0.95 }}
                whileInView={{ opacity: 1, scale: 1 }}
                viewport={{ once: true, margin: "-50px" }}
                transition={{ delay: delay, duration: 0.4 }}
                className="group relative block w-full h-32 md:h-40 rounded-[20px] overflow-hidden border border-white/10 hover:border-blue-500/50 transition-all duration-500 shadow-lg hover:shadow-[0_0_30px_rgba(59,130,246,0.2)]"
            >
                <img src={imgUrl} alt={title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 opacity-50 group-hover:opacity-100" />
                <div className="absolute inset-0 bg-gradient-to-t from-darkbg via-darkbg/60 to-transparent"></div>
                <div className="absolute bottom-0 left-0 w-full p-4">
                    <span className="text-blue-400 text-[10px] font-bold uppercase tracking-wider mb-0.5 block">{category}</span>
                    <h3 className="text-white font-bold text-sm md:text-base leading-tight group-hover:text-accent transition-colors">{title}</h3>
                </div>
            </motion.a>
        );

        const FAQItem = ({ question, answer, delay }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <motion.div 
                    initial={{ opacity: 0, y: 10 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true, margin: "-50px" }} transition={{ delay }}
                    className="bg-white/[0.02] border border-white/10 rounded-2xl overflow-hidden cursor-pointer hover:bg-white/[0.05] backdrop-blur-md transition-all duration-300 shadow-md"
                    onClick={() => setIsOpen(!isOpen)}
                >
                    <div className="p-4 flex justify-between items-center gap-4">
                        <h4 className="text-white font-bold text-sm">{question}</h4>
                        <div className={`text-accent font-bold transition-transform duration-300 ${isOpen ? 'rotate-45 text-red-400' : ''}`}>+</div>
                    </div>
                    <AnimatePresence>
                        {isOpen && (
                            <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} exit={{ height: 0, opacity: 0 }} className="overflow-hidden">
                                <p className="px-4 pb-4 text-gray-400 text-xs leading-relaxed border-t border-white/5 pt-3 mt-1">{answer}</p>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </motion.div>
            );
        };

        const Navbar = ({ lang, setLang, theme, setTheme }) => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileOpen, setMobileOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { href: '#projects', label: 'Projeler', labelEn: 'Projects' },
                { href: '#services', label: 'Hizmetler', labelEn: 'Services' },
                { href: '#pricing', label: 'Fiyat Al', labelEn: 'Pricing' },
                { href: '#faq', label: 'SSS', labelEn: 'FAQ' }
            ];

            return (
                <header className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? 'bg-darkbg/80 backdrop-blur-xl border-b border-white/5 py-4 shadow-2xl' : 'bg-transparent py-6'}`}>
                    <div className="max-w-xl mx-auto px-4 sm:px-6 flex justify-between items-center relative">
                        <a href="index.html" className="text-xl font-black tracking-tighter text-white flex items-center gap-2 z-50 hover:opacity-80 transition-opacity">
                            <div className="w-10 h-10 rounded-lg flex items-center justify-center shadow-[0_0_15px_rgba(0,255,136,0.5)] overflow-hidden bg-white/5">
                                <img src="images/logocreator.png" alt="Logo" className="w-full h-full object-cover scale-110" />
                            </div>
                            <span className="hidden sm:inline">Web <span className="text-gray-400 font-medium text-base">CreatorTR</span></span>
                        </a>
                        
                        <nav className="hidden md:flex items-center gap-6">
                            {navLinks.map(link => (
                                <a key={link.href} href={link.href} className="text-xs font-bold text-gray-400 hover:text-white transition-colors tracking-wide">
                                    {lang === 'tr' ? link.label : link.labelEn}
                                </a>
                            ))}
                        </nav>

                        <div className="flex items-center gap-3 z-50">
                            <button onClick={() => setLang(l => l === 'tr' ? 'en' : 'tr')} className="text-[10px] font-bold text-gray-400 hover:text-white uppercase px-2 py-1 rounded border border-white/10 hover:border-white/30 transition-colors bg-white/5">
                                {lang === 'tr' ? 'EN' : 'TR'}
                            </button>
                            <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} className="text-base text-gray-400 hover:text-white p-1 rounded hover:bg-white/10 transition-colors">
                                {theme === 'dark' ? '☀️' : '🌙'}
                            </button>
                            <button className="md:hidden text-white ml-2" onClick={() => setMobileOpen(!mobileOpen)}>
                                <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    {mobileOpen ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /> : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />}
                                </svg>
                            </button>
                        </div>
                    </div>

                    <AnimatePresence>
                        {mobileOpen && (
                            <motion.div 
                                initial={{ opacity: 0, y: -10 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -10 }} transition={{ duration: 0.3 }}
                                className="md:hidden fixed inset-0 w-full h-[100dvh] bg-darkbg/95 backdrop-blur-3xl flex flex-col items-center justify-center gap-8 shadow-2xl z-40"
                            >
                                {navLinks.map(link => (
                                    <a key={link.href} href={link.href} onClick={() => setMobileOpen(false)} className="text-2xl font-bold text-gray-300 hover:text-accent transition-colors">
                                        {lang === 'tr' ? link.label : link.labelEn}
                                    </a>
                                ))}
                                <a href="index.html" className="mt-6 bg-white/5 border border-white/10 text-white px-8 py-3 rounded-full font-bold text-base hover:bg-white/10 transition-all">
                                    {lang === 'tr' ? 'Ana Siteye Git' : 'Visit Main Site'}
                                </a>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </header>
            );
        };

        const TechMarquee = () => {
            const techList = ["HTML5", "CSS3", "JavaScript", "React", "Next.js", "TailwindCSS", "Node.js", "Python"];
            const MarqueeContent = () => (
                <div className="flex gap-8 px-4 items-center justify-center min-w-max">
                    {techList.map((tech, i) => (<div key={i} className="flex items-center gap-2"><span className="text-accent/50 text-lg">✦</span><span className="text-sm md:text-base font-bold text-gray-500 uppercase">{tech}</span></div>))}
                </div>
            );
            return (
                <div className="py-4 border-y border-white/5 overflow-hidden flex relative mb-8 w-full max-w-full">
                    <div className="absolute left-0 top-0 bottom-0 w-12 bg-gradient-to-r from-darkbg to-transparent z-10 pointer-events-none"></div>
                    <div className="absolute right-0 top-0 bottom-0 w-12 bg-gradient-to-l from-darkbg to-transparent z-10 pointer-events-none"></div>
                    <div className="flex w-max animate-marquee">
                        <MarqueeContent /><MarqueeContent />
                    </div>
                </div>
            );
        }

        const PromoCountdown = ({ lang }) => {
            const [timeLeft, setTimeLeft] = useState({ h: 23, m: 59, s: 59 });
            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        let {h, m, s} = prev;
                        if(s > 0) s--;
                        else { s = 59; if(m > 0) m--; else { m = 59; if(h > 0) h--; } }
                        return {h, m, s};
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);
            return (
                <motion.div initial={{opacity:0, y:20}} whileInView={{opacity:1, y:0}} viewport={{once:true}} className="w-full bg-gradient-to-r from-accent/10 to-blue-500/10 border border-accent/20 backdrop-blur-lg p-5 rounded-[20px] mb-8 relative overflow-hidden flex flex-col items-center text-center shadow-[0_0_30px_rgba(0,255,136,0.1)]">
                    <div className="absolute -top-10 -right-10 w-32 h-32 bg-accent/20 blur-[30px] rounded-full pointer-events-none"></div>
                    <h3 className="text-white font-bold text-sm md:text-base mb-3 flex items-center gap-2">
                        <span className="text-lg md:text-xl">⏳</span> {lang === 'tr' ? 'Hafta Sonu İndirimi: Paketlerde %20 İndirim' : 'Weekend Sale: 20% Off on Packages'}
                    </h3>
                    <div className="flex gap-3 text-white relative z-10">
                        <div className="bg-darkbg/50 px-2 sm:px-3 py-1.5 sm:py-2 rounded-lg border border-white/10"><span className="text-lg sm:text-xl font-black text-accent">{String(timeLeft.h).padStart(2,'0')}</span><span className="text-[10px] block text-gray-400">{lang === 'tr' ? 'SAAT' : 'HRS'}</span></div>
                        <div className="text-xl font-black mt-1">:</div>
                        <div className="bg-darkbg/50 px-2 sm:px-3 py-1.5 sm:py-2 rounded-lg border border-white/10"><span className="text-lg sm:text-xl font-black text-accent">{String(timeLeft.m).padStart(2,'0')}</span><span className="text-[10px] block text-gray-400">{lang === 'tr' ? 'DAK' : 'MIN'}</span></div>
                        <div className="text-xl font-black mt-1">:</div>
                        <div className="bg-darkbg/50 px-2 sm:px-3 py-1.5 sm:py-2 rounded-lg border border-white/10"><span className="text-lg sm:text-xl font-black text-accent">{String(timeLeft.s).padStart(2,'0')}</span><span className="text-[10px] block text-gray-400">{lang === 'tr' ? 'SAN' : 'SEC'}</span></div>
                    </div>
                </motion.div>
            );
        };

        const Timeline = ({ lang }) => {
            const steps = [
                { icon: "1", title: lang === 'tr' ? "İhtiyaç Analizi" : "Analysis", desc: lang === 'tr' ? "Hedeflerinizi dinler ve planlarız." : "We listen to your goals and plan." },
                { icon: "2", title: lang === 'tr' ? "Tasarım & Kodlama" : "Design & Dev", desc: lang === 'tr' ? "Modern arayüz ve performanslı kod." : "Modern UI and performant code." },
                { icon: "3", title: lang === 'tr' ? "Yayına Alma" : "Deployment", desc: lang === 'tr' ? "Testler sonrası sitenizi dünyaya açarız." : "Go live after rigorous testing." }
            ];
            return (
                <div id="process" className="w-full relative mb-10 mt-6">
                    <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} className="text-sm font-bold text-gray-400 uppercase tracking-widest mb-6 px-2">{lang === 'tr' ? 'İş Sürecimiz' : 'Our Process'}</motion.h2>
                    <div className="relative border-l border-white/10 ml-4 space-y-6 pb-4">
                        {steps.map((step, idx) => (
                            <motion.div key={idx} initial={{ opacity: 0, x: -20 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true }} transition={{ delay: idx * 0.1 }} className="relative pl-8 group cursor-pointer">
                                <div className="absolute -left-4 top-1 w-8 h-8 rounded-full bg-darkbg border-2 border-white/20 flex items-center justify-center text-xs font-bold text-gray-400 group-hover:border-accent group-hover:text-accent group-hover:shadow-[0_0_10px_rgba(0,255,136,0.3)] transition-all z-10">{step.icon}</div>
                                <div className="bg-white/[0.02] backdrop-blur-md border border-white/10 p-4 rounded-xl group-hover:bg-white/[0.05] group-hover:border-accent/30 transition-all duration-300 shadow-md">
                                    <h3 className="font-bold text-white text-sm group-hover:text-accent transition-colors">{step.title}</h3>
                                    <p className="text-xs text-gray-400 mt-1 leading-relaxed">{step.desc}</p>
                                </div>
                            </motion.div>
                        ))}
                    </div>
                </div>
            );
        };

        const Tips = ({ lang }) => {
            const tips = [
                { icon: "💡", title: lang === 'tr' ? "Neden Web Sitesi?" : "Why a Website?", desc: lang === 'tr' ? "İşletmenizin 7/24 açık şubesidir. Müşteri güvenini %70 artırır." : "It's your 24/7 branch. Increases trust by 70%." },
                { icon: "🚀", title: lang === 'tr' ? "SEO Nedir?" : "What is SEO?", desc: lang === 'tr' ? "Google'da üst sıralara çıkarak organik müşteri kazanmanızı sağlar." : "Helps you rank higher on Google and get organic clients." },
                { icon: "📱", title: lang === 'tr' ? "Mobil Uyum" : "Mobile is Key", desc: lang === 'tr' ? "Ziyaretçilerin %80'i telefondan girer. Hızlı açılması şarttır." : "80% of users visit via mobile. Speed is crucial." },
                { icon: "⚡", title: lang === 'tr' ? "Hızın Önemi" : "Speed Matters", desc: lang === 'tr' ? "3 saniyeden geç açılan siteler ziyaretçilerin %50'sini kaybeder." : "Sites taking >3s to load lose 50% of visitors." }
            ];

            return (
                <div id="tips" className="w-full relative mb-10 mt-6">
                    <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} className="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4 px-2">{lang === 'tr' ? 'Faydalı İpuçları' : 'Useful Tips'}</motion.h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {tips.map((tip, idx) => (
                            <motion.div 
                                key={idx} 
                                initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ delay: 0.2 + (idx * 0.1) }} 
                                className="bg-white/[0.02] backdrop-blur-md border border-white/10 p-5 rounded-[20px] hover:bg-white/[0.05] hover:border-accent/50 transition-all duration-500 group flex flex-col cursor-default shadow-lg hover:shadow-[0_0_20px_rgba(0,255,136,0.1)]"
                            >
                                <div className="text-3xl mb-2 group-hover:scale-110 group-hover:-translate-y-1 transition-transform duration-300 origin-left">{tip.icon}</div>
                                <h3 className="font-bold text-white text-sm mb-2 group-hover:text-accent transition-colors">{tip.title}</h3>
                                <p className="text-[11px] md:text-xs text-gray-400 leading-relaxed">{tip.desc}</p>
                            </motion.div>
                        ))}
                    </div>
                </div>
            );
        };

        const LinkTreeApp = () => {
            const [selectedServices, setSelectedServices] = useState([]);
            const [extraPages, setExtraPages] = useState(0);
            const [showValidityToast, setShowValidityToast] = useState(false);
            const [lang, setLang] = useState('tr');
            const [theme, setTheme] = useState('dark');
            const [scrollProgress, setScrollProgress] = useState(0);

            useEffect(() => {
                if(theme === 'light') document.body.classList.add('light-mode');
                else document.body.classList.remove('light-mode');
            }, [theme]);

            const faqData = [
                { question: lang === 'tr' ? "Proje teslim süresi ortalama nedir?" : "What is the average delivery time?", answer: lang === 'tr' ? "Genellikle projenin kapsamına bağlı olarak 1-3 hafta içerisinde anahtar teslim yapıyoruz. Standart paketlerde bu süre daha da kısalabilir." : "Usually 1-3 weeks depending on the project scope. Standard packages can be faster." },
                { question: lang === 'tr' ? "Domain ve hosting fiyata dahil mi?" : "Are domain and hosting included?", answer: lang === 'tr' ? "Seçtiğiniz paketlere göre değişiklik gösterir. Pro ve Pro+ paketlerde 1 yıllık alan adı (domain) ve sunucu (hosting) masrafları fiyata dahildir." : "It varies by package. Pro and Pro+ include 1 year of domain and hosting." },
                { question: lang === 'tr' ? "Sonradan destek sağlıyor musunuz?" : "Do you provide post-launch support?", answer: lang === 'tr' ? "Evet, tüm teslimatlarımızda ilk ay ücretsiz teknik destek sunuyoruz. Sonrasında isteğe bağlı ek bakım paketlerimizden faydalanabilirsiniz." : "Yes, we offer 1 month free support on all deliveries. Optional maintenance packages are available afterwards." },
                { question: lang === 'tr' ? "Sitemi sonradan kendim güncelleyebilir miyim?" : "Can I update the site myself later?", answer: lang === 'tr' ? "Elbette! Pro+ paketimizde ve ekstra olarak ekleyebileceğiniz 'Özel Yönetim Paneli' sayesinde teknik bilgi gerektirmeden ürün/yazı ekleyebilir, fiyatları güncelleyebilirsiniz." : "Absolutely! With the 'Custom Admin Panel' you can easily add products/posts without technical knowledge." }
            ];

            const projectsData = [
                {
                    title: lang === 'tr' ? "Diyetisyen Sitesi" : "Dietitian Website",
                    category: lang === 'tr' ? "Kurumsal" : "Corporate",
                    link: "diyetisyen.html",
                    imgUrl: "https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=500&auto=format&fit=crop"
                },
                {
                    title: lang === 'tr' ? "Restoran Menü" : "Restaurant Menu",
                    category: lang === 'tr' ? "E-Ticaret" : "E-Commerce",
                    link: "restoran/index.html",

                        <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ delay: 0.3 }} className="w-full mt-5 bg-white/[0.02] backdrop-blur-md border border-white/10 p-6 rounded-[20px] shadow-lg">
                            <div className="flex justify-between items-end mb-6">
                                <div>
                                    <h3 className="text-white font-bold text-sm md:text-base">{lang === 'tr' ? 'Ekstra Sayfa İhtiyacı' : 'Extra Pages Needed'}</h3>
                                    <p className="text-gray-400 text-[11px] md:text-xs mt-1">{lang === 'tr' ? 'Özel tasarım ek sayfa ekleyin.' : 'Add custom designed extra pages.'}</p>
                                </div>
                                <div className="text-accent font-black text-2xl md:text-3xl flex items-baseline gap-1">
                                    {extraPages} <span className="text-[10px] md:text-xs font-bold text-gray-500 mb-1 uppercase tracking-widest">{lang === 'tr' ? 'Sayfa' : 'Pages'}</span>
                                </div>
                            </div>
                            <input 
                                type="range" min="0" max="20" step="1" 
                                value={extraPages} 
                                onChange={(e) => setExtraPages(parseInt(e.target.value))} 
                                className="w-full h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-accent"
                                style={{ background: `linear-gradient(to right, #00ff88 0%, #00ff88 ${(extraPages/20)*100}%, rgba(255,255,255,0.1) ${(extraPages/20)*100}%, rgba(255,255,255,0.1) 100%)` }}
                            />
                            <div className="flex justify-between text-gray-500 text-[10px] md:text-xs mt-3 font-medium px-1">
                                <span>0</span><span className="text-accent/70 font-bold">{lang === 'tr' ? 'Her Ek Sayfa +500 ₺' : 'Per Extra Page +500 ₺'}</span><span>20+</span>
                            </div>
                        </motion.div>

                        <AnimatePresence>
                            {(selectedServices.length > 0 || extraPages > 0) && (
                                <motion.div 
                                    initial={{ opacity: 0, height: 0, y: -20 }} 
                                    animate={{ opacity: 1, height: 'auto', y: 0 }} 
                                    exit={{ opacity: 0, height: 0, y: -20 }} 
                                    className="mt-6 overflow-hidden"
                                >
                                    <div className="bg-gradient-to-b from-white/[0.05] to-transparent border border-white/20 backdrop-blur-xl p-6 rounded-[20px] flex flex-col items-center text-center shadow-[0_10px_40px_rgba(0,0,0,0.3)]">
                                        <div className="text-xs text-gray-400 font-bold uppercase tracking-widest mb-2">{lang === 'tr' ? 'Tahmini Toplam Tutar' : 'Estimated Total'}</div>
                                        <div className="text-4xl font-black text-white mb-6">{totalPrice.toLocaleString('tr-TR')} <span className="text-accent text-2xl">₺</span></div>
                                        <a 
                                            href={waLink} 
                                            target="_blank" rel="noopener noreferrer" 
                                            className="relative overflow-hidden w-full bg-gradient-to-r from-accent to-[#00b3ff] text-darkbg font-extrabold py-4 rounded-xl flex items-center justify-center gap-3 hover:scale-[1.02] transition-transform shadow-[0_0_30px_rgba(0,255,136,0.4)] group"
                                        >
                                            <div className="absolute top-0 bottom-0 w-12 bg-white/30 blur-[10px] -skew-x-[30deg] animate-shine z-0"></div>
                                            <svg className="w-6 h-6 relative z-10" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm.082 21.166c-1.802 0-3.568-.48-5.114-1.39l-5.694 1.495 1.524-5.551c-1.006-1.583-1.536-3.424-1.536-5.297 0-5.467 4.448-9.915 9.915-9.915 5.468 0 9.917 4.448 9.917 9.915 0 5.468-4.449 9.915-9.915 9.915z"/></svg>
                                            <span className="relative z-10">{lang === 'tr' ? "Bu Teklifle WhatsApp'tan İletişime Geç" : "Send Quote via WhatsApp"}</span>
                                        </a>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </div>

                    <Timeline lang={lang} />
                    <Tips lang={lang} />

                    {/* Müşteri Yorumları */}
                    <div id="testimonials" className="w-full relative mt-10">
                        <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} className="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4 px-2">{lang === 'tr' ? 'Müşteri Yorumları' : 'Testimonials'}</motion.h2>
                        <div className="space-y-3">
                            <motion.div initial={{ opacity: 0, x: -20 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true }} transition={{ delay: 0.1 }} className="bg-white/[0.02] backdrop-blur-md border border-white/10 p-5 rounded-2xl relative shadow-lg">
                                <div className="text-accent mb-2 text-lg tracking-widest">★★★★★</div>
                                <p className="text-gray-300 text-sm italic mb-3">{lang === 'tr' ? '"Çınar Bey ile çalışmak harikaydı, sitemizi tam istediğimiz gibi ve çok hızlı teslim etti. Ziyaretçi sayımızda gözle görülür artış oldu."' : '"Working with Cinar was amazing, he delivered our site exactly as we wanted and very fast."'}</p>
                                <div className="text-xs font-bold text-white">- Ahmet Y. {lang === 'tr' ? '(Restoran Sahibi)' : '(Restaurant Owner)'}</div>
                            </motion.div>
                            <motion.div initial={{ opacity: 0, x: 20 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true }} transition={{ delay: 0.2 }} className="bg-white/[0.02] backdrop-blur-md border border-white/10 p-5 rounded-2xl relative shadow-lg">
                                <div className="text-accent mb-2 text-lg tracking-widest">★★★★★</div>
                                <p className="text-gray-300 text-sm italic mb-3">{lang === 'tr' ? '"Satışlarımız yeni sitemiz sayesinde %40 arttı, mobil uyumu muazzam. Her detayıyla ilgilendiği için çok teşekkürler."' : '"Our sales increased by 40% thanks to our new site. Mobile responsiveness is flawless."'}</p>
                                <div className="text-xs font-bold text-white">- Ayşe K. {lang === 'tr' ? '(Diyetisyen)' : '(Dietitian)'}</div>
                            </motion.div>
                        </div>
                    </div>

                    {/* Neden Biz? Özeti */}
                    <div id="whyus" className="w-full relative mt-10">
                        <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} transition={{ delay: 0.1 }} className="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4 px-2">{lang === 'tr' ? 'Neden Biz?' : 'Why Us?'}</motion.h2>
                        <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ delay: 0.2 }} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div className="bg-white/[0.02] backdrop-blur-md border border-white/10 p-5 rounded-[20px] text-center hover:bg-white/[0.05] hover:border-blue-500/50 hover:scale-[1.03] transition-all duration-500 group cursor-pointer flex flex-col items-center justify-center shadow-lg hover:shadow-[0_0_20px_rgba(59,130,246,0.15)]">
                                <div className="text-3xl mb-2 group-hover:scale-125 group-hover:-translate-y-1 transition-all duration-300">⚡</div>
                                <div className="text-white font-bold text-sm group-hover:text-blue-400 transition-colors">{lang === 'tr' ? 'Hızlı Teslimat' : 'Fast Delivery'}</div>
                                <div className="grid grid-rows-[0fr] group-hover:grid-rows-[1fr] transition-[grid-template-rows] duration-300 ease-in-out w-full">
                                    <div className="overflow-hidden">
                                        <div className="text-gray-400 text-[11px] leading-snug mt-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-75">{lang === 'tr' ? 'Projelerinizi hızla yayınlarız.' : 'We deploy projects fast.'}</div>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white/[0.02] backdrop-blur-md border border-white/10 p-5 rounded-[20px] text-center hover:bg-white/[0.05] hover:border-purple-500/50 hover:scale-[1.03] transition-all duration-500 group cursor-pointer flex flex-col items-center justify-center shadow-lg hover:shadow-[0_0_20px_rgba(168,85,247,0.15)]">
                                <div className="text-3xl mb-2 group-hover:scale-125 group-hover:-translate-y-1 transition-all duration-300">📱</div>
                                <div className="text-white font-bold text-sm group-hover:text-purple-400 transition-colors">{lang === 'tr' ? 'Mobil Uyumlu' : 'Mobile Ready'}</div>
                                <div className="grid grid-rows-[0fr] group-hover:grid-rows-[1fr] transition-[grid-template-rows] duration-300 ease-in-out w-full">
                                    <div className="overflow-hidden">
                                        <div className="text-gray-400 text-[11px] leading-snug mt-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-75">{lang === 'tr' ? 'Kusursuz çalışan tasarımlar.' : 'Flawless responsive designs.'}</div>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white/[0.02] backdrop-blur-md border border-white/10 p-5 rounded-[20px] text-center hover:bg-white/[0.05] hover:border-accent/50 hover:scale-[1.03] transition-all duration-500 group cursor-pointer flex flex-col items-center justify-center shadow-lg hover:shadow-[0_0_20px_rgba(0,255,136,0.15)]">
                                <div className="text-3xl mb-2 group-hover:scale-125 group-hover:-translate-y-1 transition-all duration-300">🔍</div>
                                <div className="text-white font-bold text-sm group-hover:text-accent transition-colors">{lang === 'tr' ? 'SEO Uyumlu' : 'SEO Optimized'}</div>
                                <div className="grid grid-rows-[0fr] group-hover:grid-rows-[1fr] transition-[grid-template-rows] duration-300 ease-in-out w-full">
                                    <div className="overflow-hidden">
                                        <div className="text-gray-400 text-[11px] leading-snug mt-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-75">{lang === 'tr' ? 'Üst sıralara çıkmak için optimize.' : 'Optimized to rank higher.'}</div>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white/[0.02] backdrop-blur-md border border-white/10 p-5 rounded-[20px] text-center hover:bg-white/[0.05] hover:border-pink-500/50 hover:scale-[1.03] transition-all duration-500 group cursor-pointer flex flex-col items-center justify-center shadow-lg hover:shadow-[0_0_20px_rgba(236,72,153,0.15)]">
                                <div className="text-3xl mb-2 group-hover:scale-125 group-hover:-translate-y-1 transition-all duration-300">💬</div>
                                <div className="text-white font-bold text-sm group-hover:text-pink-400 transition-colors">{lang === 'tr' ? '7/24 Destek' : '24/7 Support'}</div>
                                <div className="grid grid-rows-[0fr] group-hover:grid-rows-[1fr] transition-[grid-template-rows] duration-300 ease-in-out w-full">
                                    <div className="overflow-hidden">
                                        <div className="text-gray-400 text-[11px] leading-snug mt-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-75">{lang === 'tr' ? 'Kesintisiz teknik destek.' : 'Continuous technical support.'}</div>
                                    </div>
                                </div>
                            </div>
                        </motion.div>
                    </div>

                    {/* SSS (Sıkça Sorulan Sorular) */}
                    <div id="faq" className="w-full relative mt-10 mb-6">
                        <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} transition={{ delay: 0.1 }} className="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4 px-2">{lang === 'tr' ? 'Sıkça Sorulan Sorular' : 'FAQ'}</motion.h2>
                        <div className="space-y-3">
                            {faqData.map((faq, index) => (
                                <FAQItem 
                                    key={index}
                                    delay={0.2 + (index * 0.1)} 
                                    question={faq.question} 
                                    answer={faq.answer} 
                                />
                            ))}
                        </div>
                    </div>

                    <motion.footer initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} transition={{ delay: 0.2 }} className="mt-16 text-sm text-gray-600">
                        &copy; {new Date().getFullYear()} WebCreatorTR. Tüm hakları saklıdır.
                    </motion.footer>

                    {/* Fiyat Geçerlilik Süresi Uyarı Baloncuğu */}
                    <AnimatePresence>
                        {showValidityToast && (selectedServices.length > 0 || extraPages > 0) && (
                            <motion.div
                                initial={{ opacity: 0, y: 50 }}
                                animate={{ opacity: 1, y: 0 }}
                                exit={{ opacity: 0, y: 50 }}
                                className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-sm pointer-events-none"
                            >
                                <div className="bg-darkbg/95 backdrop-blur-xl border border-accent/30 p-4 rounded-2xl shadow-[0_10px_40px_rgba(0,255,136,0.15)] flex items-center gap-4">
                                    <div className="w-10 h-10 bg-accent/10 rounded-full flex items-center justify-center text-accent shrink-0 animate-pulse border border-accent/20">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    </div>
                                    <div>
                                        <p className="text-white text-sm font-bold leading-tight">{lang === 'tr' ? 'Teklif Geçerlilik Süresi' : 'Quote Validity Period'}</p>
                                        <p className="text-gray-400 text-xs mt-0.5">{lang === 'tr' ? 'Hesaplanan bu tutar' : 'This quote is valid for'} <span className="text-accent font-bold">24 {lang === 'tr' ? 'saat' : 'hours'}</span> {lang === 'tr' ? 'boyunca geçerlidir.' : '.'}</p>
                                    </div>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LinkTreeApp />);
    </script>
</body>
</html>
