name: Supabase'i Uyanık Tut

on:
  schedule:
    # Her 3 günde bir - Supabase ücretsiz planı 7 gün işlemsiz kalınca projeyi duraklatıyor
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Supabase'e istek gönder
    runs-on: ubuntu-latest
    steps:
      - name: REST API'ye hafif bir istek at
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://welnvftcvovkbaoxpymv.supabase.co/rest/v1/money_records?select=id&limit=1" \
            -H "apikey: sb_publishable_IKuO9fu4Qa-_i7h4nsA8eQ_FjAnhxpN" \
            -H "Authorization: Bearer sb_publishable_IKuO9fu4Qa-_i7h4nsA8eQ_FjAnhxpN"
