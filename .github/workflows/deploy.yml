name: cPanel'e FTP ile Otomatik Yayınla

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: cPanel'e yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # FTP hesabı cPanel'de doğrudan public_html dizinine kilitlendiği için
          # FTP girişinde zaten public_html'in içindeyiz, bu yüzden "/" yeterli.
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/smtp-config.php
            **/README.md
