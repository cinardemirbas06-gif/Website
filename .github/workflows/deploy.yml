name: cPanel'e FTP ile Otomatik Yayınla

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: cPanel'e yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # FTP hesabının kökü /public_html (cinardemirbas.com'un belge kök dizini).
          # Gerçek site olan cinardemirbas.com.tr ise "addon domain" olarak
          # /public_html/cinardemirbas.com.tr altında yaşıyor, o yüzden dosyaları
          # oraya yüklemeliyiz.
          server-dir: /cinardemirbas.com.tr/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/smtp-config.php
            **/README.md
